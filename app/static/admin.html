<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapwise admin</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem clamp(1rem, 4vw, 2rem) 4rem; }
    .sub { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem 1.3rem; margin-bottom: 1.2rem; }
    .sub.done { opacity: .55; }
    .raw { background: var(--surface-2); border-radius: 10px; padding: .8rem 1rem; margin: .6rem 0 1rem; white-space: pre-wrap; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    .grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: .85rem; font-weight: 650; }
    label input, label textarea, label select { margin-top: .25rem; font-weight: 400; }
    select { font: inherit; width: 100%; padding: .7rem 1rem; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); }
    .needs { max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 12px; padding: .6rem .8rem; margin-top: .25rem; font-weight: 400; }
    .needs b { display: block; margin: .5rem 0 .2rem; font-size: .8rem; color: var(--muted); }
    .needs label { display: inline-flex; gap: .3rem; align-items: center; font-weight: 400; margin: 0 .8rem .3rem 0; }
    .needs input { width: auto; margin: 0; }
    .actions { display: flex; gap: .6rem; margin-top: 1rem; flex-wrap: wrap; }
    .pill { font-size: .75rem; padding: .15rem .55rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Tapwise admin</p>
    <h2>Ideas waiting for the bank</h2>
    <p class="muted">Clean up each idea, link it to the everyday needs it solves (so the quiz can suggest it), then approve. It goes live right away, credited to the visitor.</p>
    <p><a href="/">← Back to the site</a></p>
    <div id="list"></div>
  </div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SETUP = [["automation", "Phone automation (Shortcuts / MacroDroid)"], ["link", "Opens a link, wifi, contact or text"],
  ["smarthome", "Smart home (Home Assistant)"], ["app", "A specific app"], ["maker", "Build project (Pi / Arduino)"]];

async function load() {
  const d = await fetch("/api/admin/submissions").then((r) => r.json());
  const worlds = Object.fromEntries(d.worlds.map((w) => [w.key, w.label]));
  const needsHtml = (id) => Object.keys(worlds).map((wk) => {
    const ns = d.needs.filter((n) => n.world === wk);
    return ns.length ? `<b>${esc(worlds[wk])}</b>` + ns.map((n) => `<label><input type="checkbox" name="needs" value="${n.id}">${esc(n.label)}</label>`).join("") : "";
  }).join("");
  const subs = d.submissions.sort((a, b) => (a.status !== "pending") - (b.status !== "pending"));
  $("#list").innerHTML = subs.length ? subs.map((s) => {
    const pending = s.status === "pending";
    const who = s.submitter_name ? `${esc(s.submitter_name)}${s.credit_ok ? "" : " (doesn't want credit)"}` : "anonymous";
    return `<form class="sub ${pending ? "" : "done"}" data-id="${s.id}">
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <span class="pill">#${s.id}</span><span class="pill">${esc(s.status)}${s.linked_idea_id ? " → " + esc(s.linked_idea_id) : ""}</span>
        <span class="muted" style="font-size:.85rem">${esc(s.submitted_at)} · from ${who}${s.email ? " · " + esc(s.email) : ""}</span>
      </div>
      <div class="raw">${esc(s.description)}${s.place ? `\n📍 Tag goes: ${esc(s.place)}` : ""}${s.source_url ? `\n🔗 <a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_url)}</a>` : ""}</div>
      ${pending ? `<div class="grid">
        <label>Short curious title (the hook) <input name="hook" placeholder="e.g. The Bike Lock That Remembers"></label>
        <label>Plain title <input name="title" placeholder="e.g. Log where you parked your bike"></label>
        <label class="full">Summary (one or two sentences, shown to visitors) <textarea name="summary" rows="2">${esc(s.description)}</textarea></label>
        <label>Where the tag goes <input name="place" value="${esc(s.place || "")}" placeholder="on your bike lock"></label>
        <label>What happens when you tap <input name="result" placeholder="your phone saves your location"></label>
        <label>How it's set up <select name="setup_type">${SETUP.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></label>
        <label>Difficulty <select name="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="advanced">Advanced</option></select></label>
        <label>Credit as <input name="contributor" value="${esc(s.credit_ok ? s.submitter_name || "" : "")}" placeholder="empty = A Tapwise visitor"></label>
        <label>Phone <select name="phone_support"><option value="any">Any phone</option><option value="iphone_only">iPhone only</option><option value="android_only">Android only</option></select></label>
        <div class="full"><label>Which everyday needs does it solve? (so the quiz can suggest it)</label><div class="needs">${needsHtml()}</div></div>
      </div>
      <p class="error" role="alert"></p>
      <div class="actions">
        <button class="btn primary" value="approve">Approve → into the bank</button>
        <button class="btn ghost" value="duplicate">Already in the bank</button>
        <button class="btn ghost" value="rejected">Reject</button>
      </div>` : ""}
    </form>`;
  }).join("") : `<p class="muted">No ideas yet.</p>`;
}

document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target, action = e.submitter.value, id = form.dataset.id;
  const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let res;
  if (action === "approve") {
    const f = new FormData(form);
    const body = Object.fromEntries([...f.entries()].filter(([k]) => k !== "needs"));
    body.needs = f.getAll("needs");
    body.title = body.title || body.hook;
    res = await post(`/api/admin/submissions/${id}/approve`, body);
  } else {
    res = await post(`/api/admin/submissions/${id}/status`, { status: action });
  }
  if (!res.ok) { $(".error", form).textContent = (await res.json()).error || "Something went wrong"; return; }
  load();
});
load();
</script>
</body>
</html>
