const GL = {};
for (const [ch, s] of Object.entries(FONT)) GL[ch] = s ? s.split("/") : [];
const ALIAS = { "’": "'", "‘": "'", "“": "\"", "”": "\"", "—": "-", "–": "-" };

// ---------------------------------------------------------------- canvas + primitives (integer pixels only)
const lg = document.createElement("canvas"); lg.width = W; lg.height = H;
const g = lg.getContext("2d"); g.imageSmoothingEnabled = false;
const ov = document.createElement("canvas"); ov.width = W; ov.height = H;     // overlay for dissolves
const og = ov.getContext("2d"); og.imageSmoothingEnabled = false;
let X = g;                                                                     // current target

function R(x, y, w, h, c) { X.fillStyle = P[c] || c; X.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function box(x, y, w, h, fill, ink = "k") { R(x, y, w, h, ink); R(x + 1, y + 1, w - 2, h - 2, fill); }
function T(s, x, y, c, sc = 1) {
  x = Math.round(x); y = Math.round(y);
  for (const raw of s) {
    const ch = ALIAS[raw] || raw;
    const rows = GL[ch] || GL["?"];
    X.fillStyle = P[c] || c;
    for (let r = 0; r < rows.length; r++)
      for (let i = 0; i < 5; i++) if (rows[r][i] === "#") X.fillRect(x + i * sc, y + r * sc, sc, sc);
    x += 6 * sc;
  }
}
const TW = (s, sc = 1) => [...s].length * 6 * sc - sc;
const Tc = (s, cx, y, c, sc = 1) => T(s, Math.round(cx - TW(s, sc) / 2), y, c, sc);
const Tr = (s, rx, y, c, sc = 1) => T(s, rx - TW(s, sc), y, c, sc);
function wrap(s, n) {
  const out = []; let line = "";
  for (const w of s.split(/\s+/)) {
    if (!line) line = w; else if ((line + " " + w).length <= n) line += " " + w; else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out;
}
const cut = (s, n) => (s.length <= n ? s : s.slice(0, n - 1) + "…");
const cl = (v) => Math.max(0, Math.min(1, v));
const ph = (u, a, b) => cl((u - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const pct = (v) => Math.round(v * 100) + "%";
const usd = (v) => "$" + (v >= 1 ? (Number.isInteger(v) ? String(v) : v.toFixed(2)) : Number(v.toPrecision(2)).toString());
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return ((n ^ (n >>> 15)) >>> 0) / 4294967296; }

// draw the overlay canvas onto the frame, revealing it in 2x2 blocks with an ordered dither
function dissolve(x, y, w, h, a) {
  if (a <= 0) return;
  if (a >= 1) { g.drawImage(ov, x, y, w, h, x, y, w, h); return; }
  for (let by = y; by < y + h; by += 2)
    for (let bx = x; bx < x + w; bx += 2)
      if (BAYER[((by >> 1) & 3) * 4 + ((bx >> 1) & 3)] < a) g.drawImage(ov, bx, by, 2, 2, bx, by, 2, 2);
}

// ---------------------------------------------------------------- data (the only source of shown results)
let D = null, ERR = null;
function need(cond, msg) { if (!cond) throw new Error("cases.json: " + msg); }
function load() {
  const d = JSON.parse(document.getElementById("cases").textContent);
  need(d && Array.isArray(d.cases) && d.cases.length === 3, "expected 3 cases");
  need(d.rule && [d.rule.pick_min, d.rule.covers_min, d.rule.sure_pick, d.rule.sure_covers].every((v) => typeof v === "number"), "rule thresholds missing");
  need(Number.isInteger(d.bank_size), "bank_size missing");
  const routes = d.cases.map((c) => c.jev && c.jev.outcome);
  need(routes.join() === "duplicate_by_jev,unsure_to_claude,new_to_claude", "cases are not the three routes: " + routes);
  for (const c of d.cases) {
    need(typeof c.text === "string" && Array.isArray(c.jev.shortlist) && c.jev.shortlist.length > 0, "case text/shortlist missing");

      const m = c.jev.shortlist.find((r) => r.id === c.jev.match);
      need(m && typeof m.covers === "number", "match without a recorded side-by-side answer");

  for (const c of [sh, bee]) {

const CARD_COLS = ["S", "V", "R", "Y", "G", "S", "V", "Y", "R", "G", "S"];

function slotFor(id) {                         // shelf slot that stands for a bank idea (i006 has its own)
  if (id === "i006") return I006_SLOT;
  const free = [0, 1, 3, 4, 5, 6, 7, 8, 9, 10];
  return free[Math.floor(hash(parseInt(id.replace(/\D/g, ""), 10) || 7) * free.length)];

function shelf(count, newCardOn, hl) {
  const { x, y, w, h } = SH;

// ---------------------------------------------------------------- Jev: a compact decision robot
function jev(t, pose, look) {
  const bob = pose === "idle" && Math.floor(t * 2) % 2 ? 1 : 0;
  const x = JX, y = JY + bob;
  const blink = Math.floor(t * 3) % 2 === 0;
  // antenna
  R(x + 14, y + 4, 1, 4, "k"); box(x + 12, y, 5, 5, blink ? "o" : "l"); R(x + 13, y + 1, 1, 1, "q");
  // ears
  box(x, y + 12, 4, 8, "o"); box(x + 26, y + 12, 4, 8, "o");
  // head + screen
  box(x + 3, y + 8, 24, 16, "w"); R(x + 4, y + 21, 22, 2, "G");
  R(x + 6, y + 10, 18, 10, "k"); R(x + 7, y + 11, 16, 8, "f");
  const dx = look === "right" ? 2 : look === "left" ? -1 : 0;
  if (pose === "happy" || pose === "stampDown") {           // ^ ^
    for (const ex of [x + 9, x + 17]) { R(ex + 1, y + 13, 2, 1, "o"); R(ex, y + 14, 1, 2, "o"); R(ex + 3, y + 14, 1, 2, "o"); }
  } else if (pose === "unsure") {                            // one eye squinting
    R(x + 9 + dx, y + 14, 3, 3, "o"); R(x + 17 + dx, y + 15, 3, 1, "o"); R(x + 17 + dx, y + 12, 3, 1, "l");
  } else {
    R(x + 9 + dx, y + 13, 3, 4, "o"); R(x + 17 + dx, y + 13, 3, 4, "o"); R(x + 9 + dx, y + 13, 1, 1, "q"); R(x + 17 + dx, y + 13, 1, 1, "q");
  }
  if (pose === "scan") R(x + 7, y + 11 + (Math.floor(t * 12) % 8), 16, 1, "s");   // scan line on the screen
  // neck, body, legs
  box(x + 11, y + 23, 8, 4, "G");
  box(x + 6, y + 26, 18, 10, "G"); R(x + 9, y + 28, 12, 5, "w"); R(x + 10, y + 29, 2, 2, "o");
  R(x + 14, y + 29, 6, 1, "g"); R(x + 14, y + 31, 4, 1, "g");
  box(x + 8, y + 35, 5, 3 - bob, "K"); box(x + 17, y + 35, 5, 3 - bob, "K");
  // arms
  box(x + 3, y + 27, 4, 7, "G");
  if (pose === "point") { box(x + 23, y + 27, 9, 4, "G"); box(x + 31, y + 26, 4, 5, "o"); }
  else if (pose === "stampUp") { box(x + 23, y + 17, 4, 12, "G"); box(x + 20, y + 10, 10, 8, "o"); R(x + 21, y + 16, 8, 1, "O"); }
  else if (pose === "stampDown") { box(x + 23, y + 27, 8, 4, "G"); box(x + 29, y + 24, 9, 9, "o"); R(x + 36, y + 25, 1, 7, "O"); }
  else if (pose === "unsure") { box(x + 23, y + 18, 4, 10, "G"); box(x + 22, y + 15, 5, 4, "o"); }   // scratching head
  else box(x + 23, y + 27, 4, 7, "G");
  T("JEV", x + 7, JY - 10, "o");
}

// ---------------------------------------------------------------- Claude Sonnet 5: a spark-headed writer
const SPARK = (() => {          // precomputed 23x23 mask: 0 empty, 1 ray, 2 core
  const m = new Uint8Array(23 * 23), c = 11;
  const lens = [10, 8, 10, 8, 10, 8, 10, 8, 9, 7, 9, 7];
  for (let j = 0; j < 23; j++) for (let i = 0; i < 23; i++) {
    const dx = i - c, dy = j - c, d = Math.hypot(dx, dy);
    if (d <= 4.2) { m[j * 23 + i] = 2; continue; }
    for (let k = 0; k < 12; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 6;
      const along = dx * Math.cos(a) + dy * Math.sin(a), perp = Math.abs(dx * Math.sin(a) - dy * Math.cos(a));
      if (along > 0 && along <= lens[k] && perp <= (along < 6 ? 1.1 : 0.7)) { m[j * 23 + i] = 1; break; }
    }
  }
  return m;
})();
function claude(t, awake, typing) {
  const x = CX, y = CY;
  const ray = awake ? "o" : "m", core = awake ? "l" : "n";
  const hx = x + 3, hy = y - 4;
  for (let j = 0; j < 23; j++) for (let i = 0; i < 23; i++) {          // outline first, then fill
    if (SPARK[j * 23 + i]) continue;
    const nb = (ii, jj) => ii >= 0 && jj >= 0 && ii < 23 && jj < 23 && SPARK[jj * 23 + ii];
    if (nb(i - 1, j) || nb(i + 1, j) || nb(i, j - 1) || nb(i, j + 1)) R(hx + i, hy + j, 1, 1, "k");
  }
  for (let j = 0; j < 23; j++) for (let i = 0; i < 23; i++) {
    const v = SPARK[j * 23 + i];
    if (v) R(hx + i, hy + j, 1, 1, v === 2 ? core : ray);
  }
  if (awake) { R(hx + 9, hy + 10, 1, 2, "k"); R(hx + 13, hy + 10, 1, 2, "k"); R(hx + 10, hy + 13, 3, 1, "O"); }
  else { R(hx + 8, hy + 11, 2, 1, "K"); R(hx + 13, hy + 11, 2, 1, "K"); }
  // typewriter body
  const by = y + 19;
  box(x + 1, by, 28, 15, awake ? "w" : "G"); R(x + 2, by + 11, 26, 2, awake ? "o" : "m");
  const hit = typing ? Math.floor(t * 14) % 9 : -1;
  for (let i = 0; i < 5; i++) R(x + 5 + i * 4, by + 4, 2, 2, hit === i ? "o" : "g");
  for (let i = 0; i < 4; i++) R(x + 7 + i * 4, by + 8, 2, 2, hit === i + 5 ? "o" : "g");
  box(x - 2, by + 3, 4, 6, awake ? "w" : "G"); box(x + 28, by + 3, 4, 6, awake ? "w" : "G");
  if (typing) { R(x - 1, by + 4 + (hit & 1), 2, 1, "o"); R(x + 29, by + 4 + ((hit >> 1) & 1), 2, 1, "o"); }
  box(x + 5, by + 14, 5, 3, "K"); box(x + 20, by + 14, 5, 3, "K");
  if (!awake) for (let k = 0; k < 3; k++) {                            // drifting z's
    const p = ((t * 0.6 + k / 3) % 1);
    T(k === 1 ? "Z" : "z", x - 9 - Math.round(p * 6), y + 4 - Math.round(p * 16), p < 0.85 ? "g" : "h");
  }
  T("CLAUDE", x - 3, y - 15, awake ? "o" : "g");
}
const SPARKS = Array.from({ length: 14 }, (_, k) => ({ a: (k / 14) * Math.PI * 2 + hash(k + 3) * 0.3, s: 14 + hash(k + 40) * 12 }));
function wakeBurst(p) {                                                   // p: 0..1 after waking
  if (p <= 0 || p >= 1) return;
  const cx = CX + 14, cy = CY + 7;
  for (const sp of SPARKS) {
    const r = Math.round(6 + sp.s * eo(p));
    R(cx + Math.round(Math.cos(sp.a) * r), cy + Math.round(Math.sin(sp.a) * r), p < 0.6 ? 2 : 1, p < 0.6 ? 2 : 1, p < 0.5 ? "o" : "l");
  }
}

// ---------------------------------------------------------------- UI pieces
function ideaCard(text, x, y, alpha) {
  if (alpha <= 0) return;
  box(x, y, CARD.w, CARD.h, "w"); R(x + 1, y + 1, 4, CARD.h - 2, "o");
  const lines = wrap(text, 26);
  lines.slice(0, 3).forEach((ln, i) => T(ln, x + 9, y + 3 + i * 9, "k"));
}
function miniCard(x, y) { box(x, y, 16, 11, "w"); R(x + 1, y + 1, 2, 9, "o"); R(x + 5, y + 3, 8, 1, "K"); R(x + 5, y + 6, 6, 1, "g"); }
function stamp(text, cx, cy, ink, sc = 2, shake = 0) {
  const w = TW(text, sc) + 10, h = 7 * sc + 8;
  const x = Math.round(cx - w / 2) + shake, y = Math.round(cy - h / 2);
  R(x, y, w, h, ink); R(x + 2, y + 2, w - 4, h - 4, "w"); R(x + 3, y + 3, w - 6, h - 6, ink === "O" ? "q" : ink === "v" ? "V" : "R");
  Tc(text, x + w / 2, y + 4, ink, sc);
}
function bar(x, y, w, h, frac, col) { R(x, y, w, h, "G"); const fw = Math.round(w * cl(frac)); if (fw > 0) R(x, y, fw, h, col); }
function dashedV(x, y, h, c) { for (let i = 0; i < h; i += 2) R(x, y + i, 1, 1, c); }

// Jev's panel: shortlist bars (fill over a..a+1.1s) and the side-by-side gauge (fill over b..b+1.2s)
function jevPanel(c, u, a, b, gaugeStop) {
  const { x, y, w, h } = PAN;
  box(x, y, w, h, "w");
  T("JEV: which idea covers it?", x + 4, y + 3, "K");
  const rule = D.rule;
  const bx = x + 107, bw = 30;
  c.jev.shortlist.forEach((r, i) => {
    const ry = y + 13 + i * 9;
    const p = eo(ph(u, a + i * 0.15, a + 0.6 + i * 0.15));
    if (u < a + i * 0.15) return;
    const hot = r.pick >= rule.pick_min;
    T(r.id, x + 4, ry, hot ? "O" : "g");
    T(cut(r.title, 12), x + 31, ry, hot ? "k" : "g");
    bar(bx, ry + 1, bw, 5, r.pick * p, hot ? "o" : "g");
    Tr(pct(r.pick * p), x + w - 3, ry, hot ? "O" : "g");
  });
  if (u >= a) dashedV(bx + Math.round(bw * rule.pick_min), y + 12, 27, "K");
  // gauge
  const gy = y + 42;
  if (c.jev.match && u >= b) {
    const m = c.jev.shortlist.find((r) => r.id === c.jev.match);
    const p = eio(ph(u, b, b + 1.2));
    const v = m.covers * p;
    const wob = gaugeStop && u > b + 1.2 && u < b + 1.6 ? (Math.floor(u * 16) % 2 ? 1 : -1) : 0;
    T(`covers ${c.jev.match}?`, x + 4, gy, "K");
    const gx = x + 4, gw = 128;
    bar(gx, gy + 9, gw, 5, v + wob / gw, v >= rule.sure_covers ? "v" : "o");
    const sx = gx + Math.round(gw * rule.sure_covers);
    R(sx, gy + 7, 1, 9, "k"); T("SURE", sx - 11, gy, "k");
    Tr(pct(v), x + w - 3, gy + 8, v >= rule.sure_covers ? "v" : "O");
  } else if (!c.jev.match && u >= b) {
    T(`no idea reached ${pct(rule.pick_min)}`, x + 4, gy + 4, "K");
  }
}

function claudePanel() { box(CP.x, CP.y, CP.w, CP.h, "w"); R(CP.x + 1, CP.y + 1, CP.w - 2, 10, "o"); T("CLAUDE SONNET 5", CP.x + 4, CP.y + 3, "w"); }

function header(s) { if (s) T(s, 12, 3, "k"); }

// ---------------------------------------------------------------- the five scenes
function titleScene(t) {
  const lines = ["One visitor idea,", "two AI models."];
  const n = Math.floor(ph(t, 0.15, 1.1) * 34);
  let shown = 0;
  lines.forEach((ln, i) => { const k = Math.max(0, Math.min(ln.length, n - shown)); shown += ln.length; T(ln.slice(0, k), CARD.x + 84 - TW(ln, 2) / 2, 84 + i * 20, i ? "o" : "k", 2); });
  if (t > 1.0) Tc("Jev (TypeSafe) + Claude Sonnet 5", 200, 130, "K");
}

function caseScene(ci, u, t) {
  const c = D.cases[ci];
  const enter = eo(ph(u, 0, 0.7));
  const cx = Math.round(-180 + (CARD.x + 180) * enter);
  let out = 0;
  const hl = {};
  const jc = D.jev_cost;
  let pose = "idle", look = "right";
  if (u > 0.7) pose = "scan";
  // scan beam over the shelf
  if (u > 0.7 && u < 2.0) {
    const sx = SH.x + 4 + Math.round(ph(u, 0.7, 1.9) * (SH.w - 8));
    for (let k = 0; k < 10; k++) {
      const p = k / 10;
      R(Math.round(JX + 26 + (sx - JX - 26) * p), Math.round(JY + 14 + (SH.y + 25 - JY - 14) * p), 2, 1, "o");
    }
    R(sx, SH.y + 3, 1, SH.h - 6, "o");
  }
  if (u > 1.0) for (const r of c.jev.shortlist) hl[slotFor(r.id)] = r.pick >= D.rule.pick_min ? "o" : "g";

  if (ci === 0) {                                   // ---- Jev is sure: duplicate
    if (u > 3.3) pose = u < 3.55 ? "stampUp" : u < 4.2 ? "stampDown" : "happy";
    header(u < 0.8 ? "Case 1 · a visitor suggests an idea" : u < 2.1 ? `Jev checks it against all ${D.bank_size} ideas`
      : u < 3.4 ? `Side by side: does ${c.jev.match} already cover it?` : "Jev is sure: filed as a duplicate. Claude sleeps.");
    shelf(D.bank_size, false, u > 2.0 ? { [I006_SLOT]: Math.floor(u * 4) % 2 ? "o" : "O" } : hl);
    ideaCard(c.text, cx, CARD.y, 1);
    if (u > 0.7) jevPanel(c, u, 0.8, 2.1, false);
    if (u >= 3.55) stamp("DUPLICATE", CARD.x + CARD.w / 2, CARD.y + CARD.h / 2, "O", 2, u < 3.85 ? (Math.floor(u * 20) % 2 ? 1 : -1) : 0);
    if (u >= 4.1) { Tc(`of ${c.jev.match}: ${c.jev.shortlist[0].title}`, 200, 184, "k"); Tc("filed by Jev alone · no Claude call", 200, 196, "K"); }
    if (u >= 4.6) Tc(`Jev: ${usd(jc.usd)} (avg) · ${jc.seconds} s`, 200, 210, "O");
    jev(t, pose, look); claude(t, false, false);
  } else if (ci === 1) {                            // ---- Jev isn't sure: Claude decides
    const cr = c.claude, m = c.jev.shortlist.find((r) => r.id === c.jev.match);
    if (u > 3.4) pose = u < 4.3 ? "unsure" : u < 5.0 ? "point" : "idle";
    header(u < 0.8 ? "Case 2 · another visitor idea" : u < 2.1 ? "Jev checks the bank again"
      : u < 3.4 ? `Side by side with ${c.jev.match}...` : u < 4.6 ? `${pct(m.covers)} is under the ${pct(D.rule.sure_covers)} bar: Jev isn't sure`
      : u < 5.6 ? "So Jev asks Claude for a second opinion" : "Claude makes the final call");
    shelf(D.bank_size, false, u > 2.0 ? { [I006_SLOT]: "o" } : hl);
    ideaCard(c.text, cx, CARD.y, 1);
    if (u > 0.7) jevPanel(c, u, 0.8, 2.1, true);
    if (u > 3.5 && u < 4.4) T("?", JX + 30, JY - 12 - (Math.floor(u * 4) % 2), "o", 2);
    if (u >= 3.6 && u < 5.6) stamp("NOT SURE → ASK CLAUDE", 200, 198, "O", 2);
    const fly = ph(u, 4.3, 5.0);
    if (fly > 0 && fly < 1) { const p = eio(fly); miniCard(Math.round(200 + (CX + 6 - 200) * p), Math.round(92 + (CY + 18 - 92) * p - 34 * Math.sin(Math.PI * p))); }
    const awake = u >= 5.0 && u < 7.6;
    wakeBurst(ph(u, 5.0, 5.7));
    if (u >= 5.4 && u < 7.7) {
      claudePanel();
      T(`copy of ${cr.possible_copy}?`, CP.x + 4, CP.y + 15, "K");
      if (u >= 5.9) {
        const ink = cr.verdict === "duplicate" ? "O" : cr.verdict === "new" ? "v" : "r";
        stamp(cr.verdict.replace("_", " ").toUpperCase(), CP.x + CP.w / 2, CP.y + 33, ink, 1, u < 6.1 ? 1 : 0);
        T("confidence:", CP.x + 4, CP.y + 48, "K"); T(cr.confidence, CP.x + 4, CP.y + 57, "O");
      }
    }
    if (u >= 6.0) {
      Tc(`${cr.verdict === "duplicate" ? "DUPLICATE of " + cr.possible_copy : cr.verdict.replace("_", " ").toUpperCase()} · decided by Claude`, 200, 182, "k");
      const rs = "\u201c" + cr.reason + "\u201d", n = Math.floor(ph(u, 6.1, 7.0) * rs.length);
      let used = 0;
      wrap(rs, 62).slice(0, 2).forEach((ln, i) => { const k = Math.max(0, Math.min(ln.length, n - used)); used += ln.length + 1; Tc(ln.slice(0, k).padEnd(ln.length, " "), 200, 193 + i * 9, "K"); });
    }
    if (u >= 6.8) Tc(`Jev ${usd(jc.usd)} (avg) + Claude ${usd(cr.cost_usd)} · ${cr.seconds.toFixed(1)} s`, 200, 214, "O");
    jev(t, pose, look); claude(t, awake, u >= 6.1 && u < 7.0);
  } else {                                          // ---- new idea: Claude checks and writes it up
    const cr = c.claude, isNew = cr.verdict === "new";
    if (u > 2.1) pose = u < 3.2 ? "point" : "happy";
    header(u < 0.8 ? "Case 3 · one more idea" : u < 2.1 ? "Jev checks the bank" : u < 3.2 ? "Nothing in the bank comes close"
      : u < 4.8 ? "Claude checks it: real, safe and new?" : u < 6.6 ? "Claude writes it up for the site"
      : isNew ? `A new idea joins the bank: ${D.bank_size + 1} ideas` : "Claude turned it down");
    const landed = isNew && u >= 7.2;
    shelf(landed ? D.bank_size + 1 : D.bank_size, landed, u < 2.1 ? hl : null);
    if (landed) T("IDEAS +1", SH.x - 54, SH.y + 21, "o");
    ideaCard(c.text, cx, CARD.y, 1);
    if (u > 0.7) jevPanel(c, u, 0.8, 2.0, false);
    if (u >= 2.1 && u < 3.3) stamp("NO CLEAR MATCH", 200, 196, "O", 2);
    const fly = ph(u, 2.5, 3.2);
    if (fly > 0 && fly < 1) { const p = eio(fly); miniCard(Math.round(200 + (CX + 6 - 200) * p), Math.round(92 + (CY + 18 - 92) * p - 34 * Math.sin(Math.PI * p))); }
    wakeBurst(ph(u, 3.2, 3.9));
    if (u >= 3.5) {
      claudePanel();
      const checks = [["real idea", isNew || cr.verdict === "duplicate"], ["safe", isNew || cr.verdict === "duplicate"], ["new to the bank", isNew]];
      checks.forEach(([label, ok], i) => {
        if (u < 3.9 + i * 0.3) return;
        T(label, CP.x + 4, CP.y + 16 + i * 10, "k"); T(ok ? "✓" : "✗", CP.x + CP.w - 11, CP.y + 16 + i * 10, ok ? "v" : "r");
      });
      if (u >= 4.8) { T("confidence:", CP.x + 4, CP.y + 47, "K"); T(cr.confidence, CP.x + 4, CP.y + 56, "O"); }
    }
    if (isNew && u >= 4.8) {
      const hook = "“" + cr.draft.hook + "”", title = cr.draft.title;
      const nh = Math.floor(ph(u, 4.8, 5.6) * hook.length), nt = Math.floor(ph(u, 5.6, 6.6) * title.length);
      T("Claude's write-up:", 8, 182, "g");
      T(hook.slice(0, nh), 8, 193, "O");
      T(title.slice(0, nt), 8, 204, "k");
      const curOn = Math.floor(u * 4) % 2 === 0;
      if (u < 7.0 && curOn) R(8 + (nh < hook.length ? nh : nt) * 6, nh < hook.length ? 193 : 204, 5, 8, "o");
      if (u >= 7.0) Tr(`Jev ${usd(jc.usd)} (avg) + Claude ${usd(cr.cost_usd)}`, 394, 214, "O");
    }
    const fly2 = ph(u, 6.6, 7.2);
    if (isNew && fly2 > 0 && fly2 < 1) {
      const p = eio(fly2), s = SLOT(NEW_SLOT);
      box(Math.round(120 + (s.x - 120) * p), Math.round(200 + (s.y - 200) * p - 30 * Math.sin(Math.PI * p)), 12, 14, "q");
    }
    jev(t, pose, look); claude(t, u >= 3.2, u >= 4.8 && u < 6.6);
  }
}

function costScene(t) {   // 25..28
  const u = t - 25;
  header(u < 2.4 ? "What it costs" : "");
  // the shelf behind the panel is back to its starting state once the panel covers it
  shelf(u < 0.5 ? D.bank_size + (D.cases[2].claude.verdict === "new" ? 1 : 0) : D.bank_size, u < 0.5 && D.cases[2].claude.verdict === "new", null);
  jev(t, u < 2.4 ? "happy" : "idle", "right"); claude(t, u < 2.5, false);
  X = og; og.clearRect(0, 0, W, H);
  const x = 100, y = 14, w = 200, h = 156;
  box(x, y, w, h, "w"); R(x + 1, y + 1, w - 2, 12, "o");
  Tc("COST PER 1,000 IDEAS", x + w / 2, y + 4, "w");
  const pr = D.per_1000, max = Math.max(pr.opus_alone_usd, pr.jev_plus_sonnet_usd), bw = 140;
  const grow = eo(ph(u, 0.4, 1.3));
  T("Claude Opus 5 alone", x + 8, y + 24, "k");
  bar(x + 8, y + 34, bw, 10, (pr.opus_alone_usd / max) * grow, "g"); T(usd(pr.opus_alone_usd), x + 8 + bw + 6, y + 36, "k");
  T("Jev + Sonnet 5", x + 8, y + 56, "k");
  bar(x + 8, y + 66, bw, 10, (pr.jev_plus_sonnet_usd / max) * grow, "o"); T(usd(pr.jev_plus_sonnet_usd), x + 8 + bw + 6, y + 68, "O");
  T("same 1,000 ideas,", x + 8, y + 90, "K"); T("half of them duplicates", x + 8, y + 99, "K");
  T("Jev filters, Claude writes", x + 8, y + 116, "O");
  X = g;
  const a = u < 0.4 ? ph(u, 0, 0.4) : 1 - ph(u, 2.4, 3.0);
  dissolve(x, y, w, h, a);
  X = og; og.clearRect(0, 178, W, H - 178);
  Tc("The right model for each job.", 200, 190, "k", 2);
  X = g;
  dissolve(0, 178, W, H - 178, u < 0.9 ? ph(u, 0.6, 0.9) : 1 - ph(u, 2.4, 3.0));
}

function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  X = g;
  if (ERR) { R(0, 0, W, H, "c"); T("Can't draw: bad data", 10, 10, "r"); wrap(ERR, 60).forEach((l, i) => T(l, 10, 24 + i * 10, "k")); return lg; }
  scenery(t);
  if (t < 2) {
    shelf(D.bank_size, false, null);
    titleScene(t);
    jev(t, "idle", "right"); claude(t, false, false);
  } else if (t < 9) caseScene(0, t - 2, t);
  else if (t < 17) caseScene(1, t - 9, t);
  else if (t < 25) caseScene(2, t - 17, t);
  else costScene(t);
  return lg;
}

// ---------------------------------------------------------------- boot, export hooks, live preview
try { D = load(); } catch (e) { ERR = String(e.message || e); console.error(ERR); }
window.ANIM = { W, H, DUR, FPS, error: ERR };
window.render = render;
window.frameDataURL = (t) => { render(t); return lg.toDataURL("image/png"); };
window.READY = true;

const view = document.getElementById("view"), vg = view.getContext("2d");
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  view.width = W * s; view.height = H * s; vg.imageSmoothingEnabled = false;
}
addEventListener("resize", fit); fit();
if (!/[?&]export\b/.test(location.search)) {
  const t0 = performance.now();
  const loop = (now) => { render(((now - t0) / 1000) % DUR); vg.imageSmoothingEnabled = false; vg.drawImage(lg, 0, 0, view.width, view.height); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
